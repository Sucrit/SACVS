version: "3.9"

services:

  user-service:
    build: ./backend/services/user-service
    ports:
      - "5000:5000"
    volumes:
      - ./backend/services/user-service:/app
      - ./backend/db:/prisma
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:admin@host.docker.internal:5432/sacvs_db?schema=public
      - PRISMA_SCHEMA_PATH=/prisma/schema.prisma
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_ADMIN_SECRET_KEY=${CLERK_ADMIN_SECRET_KEY:-}
      - CREDENTIALS_SERVICE_URL=http://credential-service:5100

  credential-service:
    build: ./backend/services/credential-service
    ports:
      - "5100:5100"
    volumes:
      - ./backend/services/credential-service:/app
      - ./backend/db:/prisma
      - ./backend/documents:/documents
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:admin@host.docker.internal:5432/sacvs_db?schema=public
      - PRISMA_SCHEMA_PATH=/prisma/schema.prisma
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_ADMIN_SECRET_KEY=${CLERK_ADMIN_SECRET_KEY:-}
      - BLOCKCHAIN_RPC_URL=http://host.docker.internal:7546
      - BLOCKCHAIN_CONTRACT_ADDRESS=${BLOCKCHAIN_CONTRACT_ADDRESS:-0x091BbE5f369FB8e3e34ec340675dc2dC22810642}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-interface-service:5500}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_ENFORCE_GATE=${AI_ENFORCE_GATE:-true}
      - AI_SCORE_CLEAR_THRESHOLD=${AI_SCORE_CLEAR_THRESHOLD:-0.35}
      - AI_SCORE_BLOCK_THRESHOLD=${AI_SCORE_BLOCK_THRESHOLD:-0.70}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      - FILE_ENCRYPTION_KEY=${FILE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

  credential-request-service:
    build: ./backend/services/credential-request-service
    ports:
      - "5200:5200"
    volumes:
      - ./backend/services/credential-request-service:/app
      - ./backend/db:/prisma
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:admin@host.docker.internal:5432/sacvs_db?schema=public
      - PRISMA_SCHEMA_PATH=/prisma/schema.prisma
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_ADMIN_SECRET_KEY=${CLERK_ADMIN_SECRET_KEY:-}

  notification-service:
    build: ./backend/services/notification-service
    ports:
      - "5300:5300"
    volumes:
      - ./backend/services/notification-service:/app
      - ./backend/db:/prisma
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:admin@host.docker.internal:5432/sacvs_db?schema=public
      - PRISMA_SCHEMA_PATH=/prisma/schema.prisma
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_ADMIN_SECRET_KEY=${CLERK_ADMIN_SECRET_KEY:-}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}

  gateway:
    build: ./backend/gateway
    ports:
      - "4000:4000"
    volumes:
      - ./backend/gateway:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - USER_SERVICE_URL=http://user-service:5000
      - CREDENTIALS_SERVICE_URL=http://credential-service:5100
      - CREDENTIAL_REQUEST_SERVICE_URL=http://credential-request-service:5200
      - NOTIFICATION_SERVICE_URL=http://notification-service:5300
      - AI_SERVICE_URL=http://ai-interface-service:5500
      - RATE_LIMIT_MAX=200

  ai-model-service:
    build: ./backend/ai-model-service
    ports:
      - "5001:5001"
    volumes:
      - ./backend/ai-model-service:/app
      - /app/node_modules
    environment:
      - MODEL_PATH=/app/models/fraud.pkl

  ai-interface-service:
    build: ./backend/services/ai-interface-service
    ports:
      - "5500:5500"
    volumes:
      - ./backend/services/ai-interface-service:/app
      - ./backend/db:/prisma
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:admin@host.docker.internal:5432/sacvs_db?schema=public
      - PRISMA_SCHEMA_PATH=/prisma/schema.prisma
      - CREDENTIAL_SERVICE_URL=http://credential-service:5100
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_PROVIDER=${AI_PROVIDER:-ml}
      - AI_MANAGED_ENDPOINT=${AI_MANAGED_ENDPOINT:-}
      - AI_MODEL=${AI_MODEL:-logistic-regression-fraud-v1}
      - AI_MODEL_VERSION=${AI_MODEL_VERSION:-v1}
      - AI_SCORE_CLEAR_THRESHOLD=${AI_SCORE_CLEAR_THRESHOLD:-0.35}
      - AI_SCORE_BLOCK_THRESHOLD=${AI_SCORE_BLOCK_THRESHOLD:-0.70}
      - AI_QUEUE_CONCURRENCY=${AI_QUEUE_CONCURRENCY:-3}
      - AI_QUEUE_RETRY_LIMIT=${AI_QUEUE_RETRY_LIMIT:-3}
      - AI_QUEUE_RETRY_DELAY_SECONDS=${AI_QUEUE_RETRY_DELAY_SECONDS:-30}
      - AI_MODEL_SERVICE_URL=${AI_MODEL_SERVICE_URL:-http://ai-model-service:5001}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_GATEWAY_URL=http://localhost:4000
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-}
      - VITE_CLERK_ADMIN_PUBLISHABLE_KEY=${VITE_CLERK_ADMIN_PUBLISHABLE_KEY:-}
